  type: Class
  assemblies:
  - YShared.Runtime
  namespace: YShared.Console
  summary: >-
    <b>Define a new command.</b>

    <ul><li>
            Use <code>YCInt(min, max)</code> for integer arguments. (min / max optional)
        </li><li>
            Use <code>YCFloat(min, max)</code> for float arguments. (min / max optional)
        </li><li>
            Use <code>YCEnum(typeof(Enum))</code> for enum arguments.
        </li><li>
            Use <code>YCBool</code> for boolean arguments.
        </li><li>
            Use <code>YCString</code> for string arguments.
        </li><li>
            Use <code>YCCmdArg</code> to get registered commands as an input. (Use Command[])
        </li></ul>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method)]

      public class YCommandAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method)>

      Public Class YCommandAttribute Inherits Attribute
